name: Check production migrations

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Compare migrations with production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - name: Fail if production is missing or has extra migrations
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "PRODUCTION_DATABASE_URL is not configured"; exit 1; }
          url="${DATABASE_URL/.pooler.supabase.com:6543/.pooler.supabase.com:5432}"
          versions=$(psql "$url" -Atc "select version from supabase_migrations.schema_migrations")
          scripts/ci/migration-drift.sh supabase/migrations <<<"$versions"
