name: Migrate production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA whose migrations to apply (usually the PR branch, before merging)
        required: true
        default: main

permissions:
  contents: read
  checks: read

concurrency:
  group: production-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Require the ref to include main and to have passed CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "Migrating from $sha"
          git merge-base --is-ancestor origin/main "$sha" || {
            echo "::error::$sha does not include origin/main. Merge or rebase main into the branch first."; exit 1;
          }
          for check in "Lint & typecheck" "Unit & integration (vitest)" "Database (pgTAP)" "Build" "E2E (playwright)"; do
            conclusion=$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" \
              --jq "[.check_runs[] | select(.name == \"$check\")] | sort_by(.completed_at) | last | .conclusion")
            [ "$conclusion" = "success" ] || {
              echo "::error::CI check '$check' is '${conclusion:-missing}' on $sha"; exit 1;
            }
          done
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Apply committed migrations to production
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "PRODUCTION_DATABASE_URL is not configured"; exit 1; }
          # The transaction pooler (6543) retains prepared statements across
          # clients; Supabase CLI migration retries then fail with SQLSTATE 42P05.
          MIGRATION_DATABASE_URL="${DATABASE_URL/.pooler.supabase.com:6543/.pooler.supabase.com:5432}"
          [[ "$MIGRATION_DATABASE_URL" == *".pooler.supabase.com:5432/"* ]] || {
            echo "PRODUCTION_DATABASE_URL must use the Supabase session pooler"; exit 1;
          }
          supabase db push --db-url "$MIGRATION_DATABASE_URL" --include-all --yes
