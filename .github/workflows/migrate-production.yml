name: Migrate production

on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR to migrate and merge. Leave empty to apply main's migrations (recovery).
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: production-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ inputs.pr }}
    steps:
      - name: Resolve the commit to migrate
        id: target
        shell: bash
        run: |
          if [ -z "$PR" ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::pr must be a PR number"; exit 1; }
          pr=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json state,isDraft,baseRefName,mergeStateStatus,headRefOid)
          jq -e '.state == "OPEN" and (.isDraft | not) and .baseRefName == "main"' <<<"$pr" >/dev/null || {
            echo "::error::PR #$PR must be an open, non-draft PR into main"; exit 1;
          }
          status=$(jq -r .mergeStateStatus <<<"$pr")
          [ "$status" = "CLEAN" ] || {
            echo "::error::PR #$PR is not ready to merge (mergeStateStatus $status). Update it from main and wait for CI."; exit 1;
          }
          echo "sha=$(jq -r .headRefOid <<<"$pr")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
      - name: Require CI from GitHub Actions on the PR's head
        if: inputs.pr != ''
        shell: bash
        run: |
          git merge-base --is-ancestor origin/main HEAD || {
            echo "::error::The PR does not include origin/main. Update it from main first."; exit 1;
          }
          gh api "repos/$GITHUB_REPOSITORY/commits/$(git rev-parse HEAD)/check-runs?per_page=100" \
            | scripts/ci/check-runs-gate.sh \
              "Lint & typecheck" "Unit & integration (vitest)" "Database (pgTAP)" "Build" "E2E (playwright)"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Apply committed migrations to production
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "PRODUCTION_DATABASE_URL is not configured"; exit 1; }
          # The transaction pooler (6543) retains prepared statements across
          # clients; Supabase CLI migration retries then fail with SQLSTATE 42P05.
          url="${DATABASE_URL/.pooler.supabase.com:6543/.pooler.supabase.com:5432}"
          [[ "$url" == *".pooler.supabase.com:5432/"* ]] || {
            echo "PRODUCTION_DATABASE_URL must use the Supabase session pooler"; exit 1;
          }
          echo "Migrating from $(git rev-parse HEAD)"
          supabase db push --db-url "$url" --include-all --yes
          versions=$(psql "$url" -Atc "select version from supabase_migrations.schema_migrations")
          scripts/ci/migration-drift.sh supabase/migrations <<<"$versions"
      - name: Merge the PR
        if: inputs.pr != ''
        shell: bash
        run: |
          gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --squash --match-head-commit "$(git rev-parse HEAD)" || {
            echo "::error::Migrations are applied but PR #$PR did not merge. Re-run this workflow for the same PR; it is safe to repeat."; exit 1;
          }
